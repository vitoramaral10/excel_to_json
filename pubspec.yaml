name: excel_to_json
description: Convert Excel (.xlsx) and CSV spreadsheets to JSON or Dart maps, in pure Dart. Formula results, dates, merged cells, any header row.
version: 2.0.0
homepage: https://github.com/vitoramaral10/excel_to_json
repository: https://github.com/vitoramaral10/excel_to_json
issue_tracker: https://github.com/vitoramaral10/excel_to_json/issues
funding:
  - https://github.com/sponsors/vitoramaral10

topics:
  - excel
  - json
  - csv
  - spreadsheet
  - xlsx

screenshots:
  - description: A spreadsheet with a header row and a formula converted to JSON.
    path: doc/images/banner.webp

executables:
  excel-to-json: excel_to_json

environment:
  sdk: ^3.0.0

dependencies:
  # The code uses only APIs shared by archive 3 and 4.
  archive: '>=3.6.1 <5.0.0'
  xml: '>=6.3.0 <8.0.0'

dev_dependencies:
  # Writes the spreadsheets the tests read, so they come from another library.
  excel: ^4.0.6
  lints: ^6.0.0
  test: ^1.25.0
