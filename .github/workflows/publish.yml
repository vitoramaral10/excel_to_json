name: Publish

# Pushing a tag like v1.2.3 publishes that version to pub.dev and creates the
# GitHub release. Needs automated publishing enabled on pub.dev (package Admin
# tab: GitHub Actions, repository vitoramaral10/excel_to_json, tag pattern v{{version}}).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Tag must match pubspec.yaml
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi

      - name: Get dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example bin

      - name: Analyze
        run: dart analyze --fatal-infos lib test example bin

      - name: Run tests
        run: dart test

      - name: Publish to pub.dev
        run: dart pub publish --force

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
