version: 2

# One grouped PR per ecosystem and week. For the package itself, only raise a
# lower bound when the new version is outside the allowed range, so users keep
# the widest range possible; the lockfile still moves.
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: increase-if-necessary
    groups:
      pub:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
